<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Mehdi Lakhouane</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0f0f10; color: #f5f5f5; }
    .admin-wrap { max-width: 960px; margin: 3rem auto; padding: 0 1.5rem; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; }
    h1 { margin-top: 0; }
    input, button { font: inherit; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid #333; background: #0f0f10; color: #f5f5f5; }
    button.primary { background: #2a6df4; border-color: #2a6df4; cursor: pointer; }
    button.primary:hover { filter: brightness(1.1); }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a2a2a; }
    .muted { color: #888; font-size: 0.9rem; }
    .hidden { display: none; }
    .stat { font-size: 2rem; font-weight: 600; }
  </style>
</head>
<body>
  <main class="admin-wrap">
    <h1>Admin</h1>

    <section id="login-card" class="card">
      <h2>Sign in</h2>
      <p class="muted">Only the allow-listed admin email can access analytics.</p>
      <div class="row">
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <button id="send-link" class="primary" type="button">Send magic link</button>
      </div>
      <p id="login-msg" class="muted"></p>
    </section>

    <section id="dashboard" class="card hidden">
      <div class="row" style="justify-content: space-between;">
        <div>
          <h2 style="margin:0">Analytics</h2>
          <p id="who" class="muted"></p>
        </div>
        <button id="signout" type="button">Sign out</button>
      </div>

      <div class="row" style="margin-top: 1.5rem; gap: 2rem;">
        <div>
          <div class="muted">Total pageviews</div>
          <div id="total" class="stat">–</div>
        </div>
      </div>

      <h3 style="margin-top:2rem">Daily breakdown</h3>
      <table id="daily-table">
        <thead><tr><th>Day</th><th>Path</th><th>Views</th><th>Unique</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script type="module" src="/src/admin.js"></script>
</body>
</html>
