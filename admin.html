<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Mehdi Lakhouane</title>
  <meta name="theme-color" content="#f7f5f0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-wrap { max-width: 960px; margin: 2.5rem auto; padding: 0 1.5rem; }
    .admin-wrap h1 { margin-bottom: 1.25rem; }
    .admin-wrap h2 { margin-bottom: 0.4rem; }
    .card { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.25rem; }
    .card:hover { transform: none; border-color: var(--line); }
    .admin-wrap input, .admin-wrap button { font: inherit; padding: 0.6rem 0.9rem; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
    .admin-wrap button { cursor: pointer; }
    .admin-wrap button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .admin-wrap button:hover { border-color: var(--ink); }
    .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); }
    .muted { color: var(--muted); font-size: 0.9rem; }
    .hidden { display: none; }
    .stat { font-family: var(--font-heading); font-size: 2rem; font-weight: 700; }
    .msg { border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; background: var(--bg); }
    .msg.unread { border-left: 3px solid var(--signal); }
    .msg .meta { font-size: 0.85rem; color: var(--muted); display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .msg .body { white-space: pre-wrap; line-height: 1.5; margin: 0.5rem 0; }
    .msg .actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .msg .actions button { padding: 0.35rem 0.75rem; font-size: 0.85rem; }
    .row.spread { justify-content: space-between; }
    .row.spread h2 { margin: 0; }
    .row.stats { margin-top: 1.5rem; gap: 2rem; }
    .section-heading { margin-top: 2rem; margin-bottom: 0.5rem; }
    .section-heading.messages { margin-top: 2.5rem; }
  </style>
</head>
<body>
  <div class="page-bar">
    <a class="back" href="/">← Home</a>
    <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <main class="admin-wrap">
    <h1>Admin</h1>

    <section id="login-card" class="card">
      <h2>Sign in</h2>
      <p class="muted">Only the allow-listed admin email can access analytics.</p>
      <div class="row">
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
        <button id="send-link" class="primary" type="button">Send magic link</button>
      </div>
      <p id="login-msg" class="muted"></p>
    </section>

    <section id="dashboard" class="card hidden">
      <div class="row spread">
        <div>
          <h2>Analytics</h2>
          <p id="who" class="muted"></p>
        </div>
        <button id="signout" type="button">Sign out</button>
      </div>

      <p id="dash-msg" class="muted" role="status"></p>

      <div id="dash-body">
        <div class="row stats">
          <div>
            <div class="muted">Total pageviews</div>
            <div id="total" class="stat">–</div>
          </div>
        </div>

        <h3 class="section-heading">Daily breakdown</h3>
        <table id="daily-table">
          <thead><tr><th>Day</th><th>Path</th><th>Views</th><th>Unique</th></tr></thead>
          <tbody></tbody>
        </table>

        <h3 class="section-heading messages">Messages <span id="msg-count" class="muted"></span></h3>
        <div id="messages-list"></div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/admin.js"></script>
  <script type="module">
    import { initTheme } from '/src/theme.js'
    initTheme()
  </script>
</body>
</html>
