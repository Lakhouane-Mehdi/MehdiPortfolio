<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="i18n-title" content="meta.title_screenshots">
  <title>Screenshots | Mehdi Lakhouane</title>
  <meta name="theme-color" content="#f7f5f0">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="/theme-init.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>

<body>
  <div class="page-bar">
    <a class="back" href="/" data-i18n="nav.back_home">← Back to home</a>
    <div class="lang-switch" role="group" aria-label="Language" data-i18n-attr="aria-label:nav.lang_switch_label">
      <button type="button" class="lang-btn" data-lang-btn="en" aria-pressed="false" aria-label="English" data-i18n="nav.lang_en">EN</button>
      <button type="button" class="lang-btn" data-lang-btn="de" aria-pressed="false" aria-label="Deutsch" data-i18n="nav.lang_de">DE</button>
    </div>
    <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Dark mode" data-i18n-attr="aria-label:nav.theme_toggle">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <main class="shots">
    <h1 data-i18n="screenshots.title">Screenshots</h1>
    <p class="sec-intro" data-i18n="screenshots.subtitle">A closer look at three of my projects. Click a picture to view it full size.</p>

    <h2 id="ethry">Ethry</h2>
    <div class="shot-grid">
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/ethry.webp">
          <img src="/images/ethry.webp" alt="Ethry — title screen" width="1280" height="720">
        </button>
        <figcaption class="mono" data-i18n="screenshots.ethry_title">Title screen</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/ethry-farm.webp">
          <img src="/images/ethry-farm.webp" alt="Ethry — a fenced field with crops on the farm" width="1280" height="720">
        </button>
        <figcaption class="mono" data-i18n="screenshots.ethry_farm">The farm</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/ethry-saltbreeze.webp">
          <img src="/images/ethry-saltbreeze.webp" alt="Ethry — the harbour town Saltbreeze with palms" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.ethry_salt">Saltbreeze harbour</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/ethry-emberhold.webp">
          <img src="/images/ethry-emberhold.webp" alt="Ethry — the mountain town Emberhold with lava" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.ethry_ember">Emberhold</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/ethry-card.webp">
          <img src="/images/ethry-card.webp" alt="Ethry — the adventurer card showing rank A" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.ethry_card">Adventurer’s card</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/ethry-catacombs.webp">
          <img src="/images/ethry-catacombs.webp" alt="Ethry — a dark dungeon room in the Crownhold Catacombs" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.ethry_cata">Crownhold Catacombs</figcaption>
      </figure>
    </div>

    <h2 id="sovereign">Sovereign</h2>
    <div class="shot-grid">
      <figure class="shot" id="app">
        <button type="button" class="screenshot-frame" data-img="/images/sovereign_mastermind_app.png">
          <img src="/images/sovereign_mastermind_app.png" alt="Sovereign desktop app — home screen" width="1919" height="1033">
        </button>
        <figcaption class="mono" data-i18n="screenshots.home_label">Home Screen</figcaption>
      </figure>
      <figure class="shot" id="chat">
        <button type="button" class="screenshot-frame" data-img="/images/sovereign_mastermind_chat.png">
          <img src="/images/sovereign_mastermind_chat.png" alt="Sovereign desktop app — chat interface" width="1241" height="1019">
        </button>
        <figcaption class="mono" data-i18n="screenshots.chat_label">Chat Interface</figcaption>
      </figure>
    </div>

    <h2 id="mosslight">Mosslight Hollow</h2>
    <div class="shot-grid">
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/mosslight-hollow.webp">
          <img src="/images/mosslight-hollow.webp" alt="Mosslight Hollow — the village with garden and well" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.moss_village">The village</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/mosslight-ruins.webp">
          <img src="/images/mosslight-ruins.webp" alt="Mosslight Hollow — the Moonstone Ruins with enemies" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.moss_ruins">Moonstone Ruins</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/mosslight-crafting.webp">
          <img src="/images/mosslight-crafting.webp" alt="Mosslight Hollow — the crafting menu" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.moss_craft">Crafting</figcaption>
      </figure>
      <figure class="shot">
        <button type="button" class="screenshot-frame" data-img="/images/mosslight-shop.webp">
          <img src="/images/mosslight-shop.webp" alt="Mosslight Hollow — the shop menu" width="1280" height="720" loading="lazy">
        </button>
        <figcaption class="mono" data-i18n="screenshots.moss_shop">The shop</figcaption>
      </figure>
    </div>
  </main>

  <div class="lb-overlay" id="lb" role="dialog" aria-modal="true">
    <button type="button" class="lb-close" aria-label="Close">&times;</button>
    <img alt="">
    <p class="lb-hint" data-i18n="screenshots.close_hint">Press Esc or click outside to close</p>
  </div>

  <footer class="footer-legal">
    <a href="/" data-i18n="footer.home">Home</a> ·
    <a href="/impressum.html" data-i18n="footer.impressum">Impressum</a> ·
    <a href="/datenschutz.html" data-i18n="footer.datenschutz">Privacy Policy</a>
  </footer>

  <link rel="stylesheet" href="/src/consent.css">
  <script type="module">
    import { initConsent } from '/src/consent.js'
    import { initI18n } from '/src/i18n.js'
    import { initTheme } from '/src/theme.js'
    initTheme()
    // Same consent banner + opt-in pageview tracking as the other pages.
    initI18n()
      .catch(err => console.warn('i18n init failed:', err))
      .finally(initConsent)

    const lb = document.getElementById('lb')
    const lbImg = lb.querySelector('img')
    const closeBtn = lb.querySelector('.lb-close')
    let opener = null
    const close = () => { lb.classList.remove('active'); if (opener) opener.focus(); opener = null }

    document.querySelectorAll('.screenshot-frame').forEach(frame => {
      frame.addEventListener('click', () => {
        lbImg.src = frame.dataset.img
        lbImg.alt = frame.querySelector('img').alt
        lb.classList.add('active')
        opener = frame
        closeBtn.focus()
      })
    })

    closeBtn.addEventListener('click', close)
    lb.addEventListener('click', e => { if (e.target === lb) close() })
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('active')) close() })
  </script>
</body>
</html>
